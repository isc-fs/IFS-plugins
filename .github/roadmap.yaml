# Source of truth for ROADMAP.md.
#
# Edit this file (or close / reopen a tracking issue on GitHub) and the
# `Render ROADMAP` workflow will regenerate ROADMAP.md with updated
# status badges and a fresh mermaid branch diagram. Do not hand-edit
# ROADMAP.md — the workflow will overwrite any local changes.
#
# Schema:
#   phases: list of phase clusters. Each phase has a number, a title, a
#           tag applied on dev→main when every branch in the phase has
#           landed, and a list of planned feat/fix branches. Each branch
#           has a `name` (exact git branch name) and a short `scope`
#           sentence used as the commit label in the mermaid diagram.
#   sidequests: off-roadmap branches kept in the diagram for history
#               (e.g. infrastructure work that doesn't map to a phase).

phases:
  - number: 1
    title: Publish the marketplace
    tag: v1.0.0
    branches:
      - name: feat/1-plugin-marketplace
        scope: Marketplace manifest, the four plugins, packaged files and README

  - number: 2
    title: Reach the whole team
    tag: v1.1.0
    branches:
      - name: feat/2-release-archives
        scope: Publish plugin archives as Release assets and point the marketplace at them
      - name: feat/3-install-walkthrough
        scope: Verify and document the desktop app install path, tested on one board member

  - number: 3
    title: Survive the season handover
    tag: v2.0.0
    branches:
      - name: feat/4-workspace-config
        scope: Move the hardcoded IFS09 Notion IDs into one reference file per plugin
      - name: feat/5-skill-regression-checks
        scope: Checks that catch a skill pointing at a page that no longer exists

sidequests: []
